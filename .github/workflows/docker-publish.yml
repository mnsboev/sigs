name: Build and Publish Docker Image with Attestation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: evidencetrial.jfrog.io
  IMAGE_NAME: misha-docker-docker-local/sigs

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      attestations: write  # Required for attestation
      id-token: write      # Added for OIDC token access

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: buildkitd.toml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.user }}
          password: ${{ secrets.password }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable provenance and SBOM generation
          provenance: true
          sbom: true
          outputs: |
            image_digest=digest
      
      - name: Get Image Digest
        run: |
          echo "DIGEST=${{ steps.build.outputs.image_digest }}" >> $GITHUB_ENV  

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}/${{ env.DIGEST }}/manifest.json
          subject-digest: ${{ env.DIGEST }}
      
      - name: Create evidence from attestation
        run: |
          ./create_evidence.sh
          

          
          
